[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "digikala-mcp"
version = "0.1.0"
description = "Shopping MCP for Digikala catalog and bounded cart operations"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "fastmcp==4.0.10",
    "dishka==1.10.1",
    "mcp-types>=2.2,<3",
    "pydantic>=2.12,<3",
    "keyring>=25,<26",
    "psycopg[binary]>=3.2,<4",
    "sqlmodel==0.0.47",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.18.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pyright>=1.1.409,<2"]

[project.scripts]
digikala-account = "src.account:account_cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportDeprecated = "error"
venvPath = "."
venv = ".venv"
